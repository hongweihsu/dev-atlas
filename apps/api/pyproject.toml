[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval-works-api"
version = "0.1.0"
description = "Retrieval Works FastAPI service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "bm25s>=0.3.11,<0.4",
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "langgraph>=1.2,<2",
  "openai>=2,<3",
  "pgvector>=0.3,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
evaluation = [
  "httpx>=0.28,<1",
  "ir-measures>=0.4.3,<1",
  "pillow>=12,<13",
  "reportlab>=4,<5",
]
benchmark = [
  "ir-measures>=0.4.3,<1",
  "mteb>=2.20.11,<3",
  "numpy>=1.26,<3",
  "tiktoken>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_works"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a migrated PostgreSQL test database",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
